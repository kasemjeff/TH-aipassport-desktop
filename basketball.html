<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมชูตบาสเกตบอล - Basketball Shooting Game</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #f97316;
            --primary-hover: #ea580c;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .game-container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .game-header {
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(15, 23, 42, 0.6);
        }

        .game-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stats-panel {
            display: flex;
            gap: 20px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 16px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .stat-value {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--text-main);
        }

        .canvas-wrapper {
            position: relative;
            width: 100%;
            height: 450px;
            background: linear-gradient(to bottom, #1e3a8a, #0f172a);
            cursor: crosshair;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .game-footer {
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.6);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .instructions {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(249, 115, 22, 0.3);
        }

        .btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .game-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        .overlay-title {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 10px;
            text-shadow: 0 4px 12px rgba(249, 115, 22, 0.4);
        }

        .overlay-subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 30px;
            text-align: center;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="game-header">
            <div class="game-title">
                <i class="fa-solid fa-basketball"></i> Basketball Shoot
            </div>
            <div class="stats-panel">
                <div class="stat-box">
                    <div class="stat-label">คะแนน</div>
                    <div id="score" class="stat-value">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">ลูกที่เหลือ</div>
                    <div id="shots-left" class="stat-value">10</div>
                </div>
            </div>
        </div>

        <div class="canvas-wrapper">
            <div id="start-overlay" class="game-overlay">
                <div class="overlay-title">BASKETBALL SHOOT</div>
                <div class="overlay-subtitle">คลิกและลากเมาส์เพื่อกำหนดทิศทางและความแรงในการชูตบาสลงห่วง!</div>
                <button id="start-btn" class="btn"><i class="fa-solid fa-play"></i> เริ่มเกมเลย</button>
            </div>

            <div id="gameover-overlay" class="game-overlay hidden">
                <div class="overlay-title">จบเกม!</div>
                <div id="final-score" class="overlay-subtitle">ทำคะแนนได้: 0 คะแนน</div>
                <button id="restart-btn" class="btn"><i class="fa-solid fa-rotate-right"></i> เล่นอีกครั้ง</button>
            </div>

            <canvas id="gameCanvas" width="800" height="450"></canvas>
        </div>

        <div class="game-footer">
            <div class="instructions">
                <i class="fa-solid fa-circle-info"></i> ลากเมาส์จากลูกบอล ยิ่งลากไกลยิ่งแรง ปล่อยเพื่อชูต
            </div>
            <button id="reset-btn" class="btn" style="background-color: #475569;">รีเซ็ตเกม</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const scoreEl = document.getElementById('score');
        const shotsLeftEl = document.getElementById('shots-left');
        const startOverlay = document.getElementById('start-overlay');
        const gameoverOverlay = document.getElementById('gameover-overlay');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const resetBtn = document.getElementById('reset-btn');
        const finalScoreEl = document.getElementById('final-score');

        // Game state
        let score = 0;
        let shotsLeft = 10;
        let isPlaying = false;
        let isAiming = false;
        let isShotTaken = false;
        let particles = [];

        function triggerConfetti(x, y) {
            for (let i = 0; i < 30; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 1) * 8,
                    radius: Math.random() * 4 + 2,
                    color: ['#f97316', '#38bdf8', '#22c55e', '#eab308'][Math.floor(Math.random() * 4)],
                    alpha: 1
                });
            }
        }

        // Ball properties
        const ball = {
            x: 100,
            y: 350,
            radius: 18,
            vx: 0,
            vy: 0,
            gravity: 0.35,
            active: false
        };

        // Aim line origin
        const startPos = { x: 100, y: 350 };

        // Hoop properties
        const hoop = {
            x: 650,
            y: 180,
            width: 70,
            height: 10,
            rimRadius: 8,
            scored: false
        };

        // Mouse interaction
        let mouse = { x: 0, y: 0 };

        canvas.addEventListener('mousedown', (e) => {
            if (!isPlaying || isShotTaken) return;
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            // Check if clicking near the ball
            const dist = Math.hypot(mouseX - ball.x, mouseY - ball.y);
            if (dist < 40) {
                isAiming = true;
                mouse.x = mouseX;
                mouse.y = mouseY;
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isAiming) return;
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
        });

        canvas.addEventListener('mouseup', (e) => {
            if (!isAiming) return;
            isAiming = false;
            isShotTaken = true;
            shotsLeft--;
            shotsLeftEl.textContent = shotsLeft;

            // Calculate velocity based on drag vector
            const dx = ball.x - mouse.x;
            const dy = ball.y - mouse.y;
            
            ball.vx = dx * 0.14;
            ball.vy = dy * 0.14;
            ball.active = true;
        });

        function resetBall() {
            ball.x = 100;
            ball.y = 350;
            ball.vx = 0;
            ball.vy = 0;
            ball.active = false;
            isShotTaken = false;
            hoop.scored = false;
        }

        function startGame() {
            score = 0;
            shotsLeft = 10;
            scoreEl.textContent = score;
            shotsLeftEl.textContent = shotsLeft;
            startOverlay.classList.add('hidden');
            gameoverOverlay.classList.add('hidden');
            isPlaying = true;
            resetBall();
        }

        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);
        resetBtn.addEventListener('click', () => {
            startOverlay.classList.remove('hidden');
            isPlaying = false;
        });

        function update() {
            // Update particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.2; // gravity for particles
                p.alpha -= 0.02;
                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            if (ball.active) {
                ball.vy += ball.gravity;
                ball.x += ball.vx;
                ball.y += ball.vy;

                // Check scoring collision with hoop
                if (!hoop.scored && 
                    ball.x > hoop.x - hoop.width/2 && 
                    ball.x < hoop.x + hoop.width/2 &&
                    ball.y >= hoop.y && ball.y <= hoop.y + 15 &&
                    ball.vy > 0) {
                    score += 2;
                    scoreEl.textContent = score;
                    hoop.scored = true;
                    triggerConfetti(hoop.x, hoop.y);
                }

                // Check out of bounds / floor hit
                if (ball.y > canvas.height + 50 || ball.x > canvas.width + 50 || ball.x < -50) {
                    if (shotsLeft > 0) {
                        resetBall();
                    } else {
                        isPlaying = false;
                        finalScoreEl.textContent = `ทำคะแนนได้: ${score} คะแนน`;
                        gameoverOverlay.classList.remove('hidden');
                    }
                }
            }
        }

        function draw() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Background Court elements
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(hoop.x, hoop.y, 100, Math.PI, 0, false);
            ctx.stroke();

            // Draw Backboard
            ctx.fillStyle = '#cbd5e1';
            ctx.fillRect(hoop.x + 35, hoop.y - 60, 10, 80);

            // Draw Hoop & Net
            ctx.fillStyle = '#ef4444';
            ctx.fillRect(hoop.x - hoop.width/2, hoop.y, hoop.width, hoop.height);

            // Net lines
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(hoop.x - hoop.width/2, hoop.y + hoop.height);
            ctx.lineTo(hoop.x - hoop.width/4, hoop.y + 50);
            ctx.moveTo(hoop.x + hoop.width/2, hoop.y + hoop.height);
            ctx.lineTo(hoop.x + hoop.width/4, hoop.y + 50);
            ctx.stroke();

            // Draw Aiming trajectory line
            if (isAiming) {
                ctx.strokeStyle = 'rgba(249, 115, 22, 0.6)';
                ctx.lineWidth = 3;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.moveTo(ball.x, ball.y);
                const pullX = ball.x - (mouse.x - ball.x);
                const pullY = ball.y - (mouse.y - ball.y);
                ctx.lineTo(pullX, pullY);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // Draw Basketball
            ctx.fillStyle = '#f97316';
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#c2410c';
            ctx.stroke();

            // Ball lines
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2, true);
            ctx.clip();
            ctx.strokeStyle = '#7c2d12';
            ctx.beginPath();
            ctx.moveTo(ball.x - ball.radius, ball.y);
            ctx.lineTo(ball.x + ball.radius, ball.y);
            ctx.moveTo(ball.x, ball.y - ball.radius);
            ctx.lineTo(ball.x, ball.y + ball.radius);
            ctx.stroke();
            ctx.restore(); // restore context after clip if needed, or draw particles below/above

            // Draw particles
            for (let p of particles) {
                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
