name: test

on:
  # master and main — the repo lives in two mirrors whose defaults differ
  # (kasemjeff/aipass: master, TH-aipassport-harness: main); a master-only
  # filter meant a push to the mirror never ran the suite at all.
  push:
    branches: [master, main]
  pull_request:

# A push supersedes its predecessors: cancel their runs so a hung runner
# cannot queue every newer run behind it (five runs piled up on 2026-10-17).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The suite only reads the repository. A pull request never needs a write
# token, and a compromised test helper should not get one either.
permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # A stuck job would otherwise hold its runner for the platform default of
    # six hours; the suite itself runs in minutes.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Windows is in the matrix deliberately: the path bugs fixed in #3/#4
        # only showed up there. macOS ships the second packaged bundle
        # (`tauri:build:mac`) and its branches are the ones a Windows dev
        # machine cannot run — the lane is the Node-side half of that proof;
        # the window bundle still needs real hardware. Node 20 is the floor the
        # runtime asks for (engines >=20): the code needs nothing newer, so a
        # machine still on 20 is a machine the app has to run on. Node 20 is
        # end-of-life upstream, so it is kept only for compatibility; 22 and 24
        # are the maintained lines. `node --test` changed shape in 21 and again
        # in 24 — the ends of the range are where the surprises live.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # The bridge and its tests have no runtime dependencies, so `npm test`
      # works with a clean checkout. Dev dependencies (typescript, @types/node)
      # are needed only for `npm run typecheck` below.
      - name: Install dev dependencies
        run: npm ci

      - name: Lint this guide (anchors, shims, size budgets)
        run: npm run agents:lint

      # Type-check the files that opt in with `// @ts-check`. Grows one file
      # at a time; see aipass-bridge/jsconfig.json.
      - name: Type check
        run: npm run typecheck

      # The bridge and its tests have no dependencies, so there is nothing to
      # install — the suite spawns the real server and a fake extension.
      - name: Run tests
        run: npm test

      # Trust the eval set before anyone spends a live run on it: every check
      # must fail on its untouched tree, Thai pairs must be symmetric, and no
      # file under evals/ may carry a CR byte.
      - name: Lint the eval set
        run: npm run evals:lint

      - name: Check every entry point parses
        shell: bash
        run: |
          for f in aipass-bridge/bridge/server.mjs aipass-bridge/agent.mjs \
                   aipass-bridge/chat.mjs aipass-bridge/list.mjs \
                   aipass-bridge/extension/*.js; do
            node --check "$f"
          done

      # The window's contract with the backend: every RPC method the window
      # calls has to exist, and every user-facing file has to be intact UTF-8.
      # The window is a plain page with no types, so nothing else catches a
      # method the backend does not have — it is a 404 in the window's own
      # log, in front of a person who only wanted to use the app.
      - name: Check the window's contract with the backend
        run: node scripts/qa-loop.mjs --static

      # The floor under the code the window and the backend run: a file whose
      # coverage fell through the floor is a file nobody is testing any more,
      # and the suite stays green while it happens.
      - name: Check the coverage floors
        run: npm run coverage:gate

  rust:
    name: the desktop shell
    runs-on: ${{ matrix.os }}
    # A cold Rust build of the whole tree is minutes, not seconds; the ceiling
    # is an hour so a stuck job cannot hold a runner.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Both platforms, because the shell's own tests are split by
        # `#[cfg(windows)]`: the long-path prefix, the PATH registry and the
        # per-user shim only exist on one side, and the other side has the
        # tests that only exist there. One platform leaves half the shell
        # untested and nobody notices which half.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      # Tauri on Linux needs the webkit2gtk development packages; without
      # them the shell does not compile — the same list the build lane uses.
      - name: Install the Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf

      # `tauri-build` asks for the external Node binary while it compiles, even
      # for `cargo test`, and a clean checkout has no sidecar: the ~90 MB
      # executable is gitignored on purpose. Without this the shell tests fail
      # in `build.rs` before the first test runs.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Put the Node sidecar in place
        run: npm run desktop:sidecar

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}

      # The shell's unit tests: the settings migration, the PATH handling, the
      # tray mark. They existed and never ran — nothing in CI asked for them,
      # so a broken one merged green.
      - name: Test the shell
        working-directory: desktop/src-tauri
        run: cargo test

      # Lints, reported but not a gate: a new lint rule needs the human's
      # sign-off, and a red clippy on the first run would block every commit
      # over a warning nobody has agreed to be a warning.
      - name: Lint the shell
        working-directory: desktop/src-tauri
        continue-on-error: true
        run: cargo clippy --all-targets

  docs:
    name: docs and metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # No install: the link checker uses Node built-ins only. That is the
      # point of it, and it keeps this job fast enough to run on every PR.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check every relative Markdown link
        run: npm run docs:check

      - name: Check the package metadata
        run: |
          node -e '
            const p = require("./package.json");
            const missing = ["name", "version", "license", "repository", "bugs", "homepage"]
              .filter((key) => !p[key]);
            if (missing.length) {
              console.error("package.json is missing: " + missing.join(", "));
              process.exit(1);
            }
            console.log(`${p.name}@${p.version} — ${p.license}`);
          '

  shellcheck:
    name: deploy scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Syntax-check the deployment scripts
        run: for f in aipass-bridge/deploy/*.sh; do bash -n "$f"; done

  smoke:
    name: smoke e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # The floor, not the newest: the smoke lane is the proof that the
          # oldest supported Node really runs the whole chain.
          node-version: 20
      - name: Smoke end-to-end
        run: npm run smoke:e2e
