name: dco

# Every human commit says it may be submitted under the project's MIT license.
# The check is deliberately small: a trailer whose email matches the author.
# Bot commits (Dependabot, Renovate, Actions) are exempt in the script.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: dco-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dco:
    name: signed-off-by
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # The range is base..head, so both commits must be in the clone.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check the Developer Certificate of Origin
        env:
          DCO_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DCO_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run dco
