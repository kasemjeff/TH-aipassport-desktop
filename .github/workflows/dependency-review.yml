name: dependency review

# A pull request that adds or bumps a dependency gets the diff reviewed before
# it can merge. The core has no runtime npm dependencies; the surfaces that do
# exist are dev-only npm packages, Cargo crates and the Actions pins.

on:
  pull_request:
    branches: [master, main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: review dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
