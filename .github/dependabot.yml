# The three ecosystems this repository actually has. The core ships zero
# runtime npm dependencies on purpose (docs/RELEASE.md, "Dependencies"); a
# dependency PR is reviewed like code — read the diff, run `npm run check`.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
