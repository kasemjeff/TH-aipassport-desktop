<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>aipass desktop</title>
<!-- data: favicon: a local backend has no icon to serve, and the request for
     one shows up as a 404 in every console. -->
<link rel="icon" href="data:," />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<!-- ============================================================================
     aipass desktop — the window.

     LAYOUT
       #bar    thin top row: project · permission · status · context · help ·
               theme · settings.
       #side   264px sidebar: brand, "แชทใหม่", the search field, then the
               work — history, the project's files — and, only when they have
               something in them, the playbooks and the plugin panels. The foot
               holds the two doors to the rest of the app (ตั้งค่า / วิธีใช้).
               Collapses via the ☰ labels (pure CSS, no JS).
        #chat   one grid, rows stacked: #meta, then the stage (#log), then
                #pending, #attachments and #composer. The composer carries the
                model and the effort level — both ride the next message.

     IDS app.js ALREADY OWNS (kept, same handlers) — do not rename:
       bar, project, add-project, model, thinking, mode, status, context,
       help-btn, settings-btn, side, sessions, session-count, files, files-head,
       plugin-panels, plugins-group, skills, skills-group, session-filter,
       new-session, side-settings, side-help, chat, meta, log, pending,
       pending-count, pending-list, apply, discard, composer, task, slash,
       slash-list, attachments, attachment-list, attach-btn, slash-btn,
       file-picker, send, hint, modal, modal-title, modal-body, modal-actions.

     The reference-design extras that stayed:
       #theme-toggle    flips dark/light and writes the choice through settings.set.
       #new-chat-quick  a <label for="file-picker">, so it opens the picker —
                        attach, then type.

     THE SIDEBAR IS THE WORK, NOT THE CONFIGURATION.
       The rail answers three questions — what am I working on, what did I work
       on, what is in this folder — and nothing else. Anything that *configures*
       the app (the model, the rules, the plugins, the MCP servers, what the
       app remembers about you) lives in the settings sheet, one click away
       from the foot of this column. A row that leads nowhere is not a feature,
       so the sections that have nothing to show are hidden outright.

     Every row here does something you can see:
       แชทใหม่              #new-session   → a fresh session
       ＋                   #file-picker   → attach a file, then ask about it
       the search field     #session-filter → filters the history below it
       a history row        → opens that session
       a file row           → opens the file (and แนบ stages it)
       คู่มือ               the playbooks on disk (hidden when there are none)
       ปลั๊กอิน              the panels plugins draw (hidden when there are none)
       ตั้งค่า / วิธีใช้    the settings sheet and the guide

     ============================================================================ -->

<!-- Sidebar collapse. A checkbox + two <label for="nav-toggle"> ☰ buttons; the
     CSS does the rest, so the sidebar folds with no JS to keep in sync. -->
<input type="checkbox" id="nav-toggle" class="nav-toggle" aria-hidden="true" tabindex="-1" />

<!-- One slim row. The essentials only: what am I working on, how much may it
     change, and is it even connected. Everything else is /, ?, or the gear. -->
<header id="bar">
  <label class="icon-btn burger" for="nav-toggle" title="พับ/ขยายเมนูข้าง">☰</label>
  <div class="brand"><span class="brand-dot" aria-hidden="true"></span>aipass</div>

  <label class="field" title="โปรเจกต์ที่ agent แตะได้">
    <select id="project" title="โปรเจกต์"></select>
  </label>
  <button id="add-project" class="icon-btn" title="เปิดโฟลเดอร์อื่น">+</button>

  <label class="field" title="สิทธิ์แก้ไฟล์">
    <select id="mode" title="โหมด: สิทธิ์แก้ไฟล์ + plan · Shift+Tab วนโหมด">
      <option value="ask" title="ถามก่อนเขียนทุกไฟล์">ask</option>
      <option value="auto" title="เขียนเลยไม่ถาม">auto</option>
      <option value="yolo" title="เขียน+รันคำสั่งได้">yolo</option>
      <option value="plan" title="ร่างแผนให้อนุมัติก่อน แล้วทำตามแผน">plan</option>
    </select>
  </label>

  <span class="grow"></span>
  <div class="status" id="status"></div>
  <span class="context hidden" id="context" title="context budget"></span>
  <button id="help-btn" class="icon-btn" title="วิธีใช้"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.3 9.4a2.8 2.8 0 0 1 5.5.8c0 1.8-2.8 2-2.8 3.4"/><path d="M12 17.1h.01"/></svg></button>
  <button id="theme-toggle" class="icon-btn" title="สลับธีมสว่าง/มืด"><svg class="i-moon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.4 14.6A8.6 8.6 0 0 1 9.4 3.6a8.6 8.6 0 1 0 11 11z"/></svg><svg class="i-sun" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.7"/><path d="M12 2.6v2.2M12 19.2v2.2M4.5 4.5l1.6 1.6M17.9 17.9l1.6 1.6M2.6 12h2.2M19.2 12h2.2M4.5 19.5l1.6-1.6M17.9 6.1l1.6-1.6"/></svg></button>
  <button id="settings-btn" class="icon-btn" title="ตั้งค่า"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 14.5a1.7 1.7 0 0 0 .34 1.87l.06.06a2.06 2.06 0 1 1-2.91 2.91l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2.06 2.06 0 0 1-4.12 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2.06 2.06 0 1 1-2.91-2.91l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2.06 2.06 0 0 1 0-4.12h.09a1.7 1.7 0 0 0 1.56-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2.06 2.06 0 1 1 2.91-2.91l.06.06a1.7 1.7 0 0 0 1.87.34h.08a1.7 1.7 0 0 0 1.03-1.56V3a2.06 2.06 0 0 1 4.12 0v.09a1.7 1.7 0 0 0 1.03 1.56h.08a1.7 1.7 0 0 0 1.87-.34l.06-.06a2.06 2.06 0 1 1 2.91 2.91l-.06.06a1.7 1.7 0 0 0-.34 1.87v.08a1.7 1.7 0 0 0 1.56 1.03H21a2.06 2.06 0 0 1 0 4.12h-.09a1.7 1.7 0 0 0-1.51 1.18z"/></svg></button>
</header>

<main>
  <aside id="side">
    <div class="side-top">
      <div class="side-brand">
        <svg class="logo" viewBox="0 0 24 24" width="26" height="26" role="img" aria-label="AiPASS">
          <defs>
            <linearGradient id="aipass-logo" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#e2a184" />
              <stop offset="1" stop-color="#c96442" />
            </linearGradient>
          </defs>
          <rect x="1" y="1" width="22" height="22" rx="7" fill="url(#aipass-logo)" />
          <path d="M12 5.6l1.9 4.5 4.5 1.9-4.5 1.9L12 18.4l-1.9-4.5L5.6 12l4.5-1.9z" fill="#fff" />
        </svg>
        <span class="wordmark">AiPASS<sup>TM</sup></span>
        <label class="icon-btn side-burger" for="nav-toggle" title="พับเมนู">☰</label>
      </div>

      <!-- The one thing you do most: start a conversation. Attach sits beside
           it because "here is a file, ask about it" is the other half of it. -->
      <div class="new-row">
        <button type="button" id="new-session" class="btn-new" title="เริ่มบทสนทนาใหม่">
          <span class="pencil" aria-hidden="true">✎</span>แชทใหม่
        </button>
        <label class="btn-dashed" id="new-chat-quick" for="file-picker" title="แนบไฟล์ แล้วคุยต่อได้เลย" aria-label="แนบไฟล์">＋</label>
      </div>

      <!-- The search is a field, not a row that points at one. It used to live
           folded away inside another row, so clicking it focused a box you
           could not see: a control that looked broken because it was. -->
      <div class="side-search">
        <span class="nav-ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20.2 20.2 16 16"/></svg></span>
        <input type="search" id="session-filter" placeholder="ค้นหาบทสนทนา…" aria-label="ค้นหาบทสนทนา" title="ค้นหาบทสนทนา (Ctrl+K)" />
      </div>

      <!-- What the rail is for: the work. -->
      <section class="side-section">
        <h3 class="side-h">ประวัติการสนทนา<span class="side-count" id="session-count"></span></h3>
        <ul id="sessions" class="list"></ul>
      </section>

      <section class="side-section">
        <h3 class="side-h" id="files-head">ไฟล์ในโปรเจกต์</h3>
        <ul id="files" class="list dim"></ul>
      </section>

      <!-- Only when there is something in them: a section with nothing in it is
           a row that leads nowhere. -->
      <details class="nav-group" id="skills-group" hidden>
        <summary class="nav-item" title="คู่มือ (playbook) ที่บันทึกไว้ — คลิกเพื่ออ่าน">
          <span class="nav-ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4.5h5.6a4.4 4.4 0 0 1 4.4 4.4V21a3.4 3.4 0 0 0-3.4-3.4H2z"/><path d="M22 4.5h-5.6A4.4 4.4 0 0 0 12 8.9V21a3.4 3.4 0 0 1 3.4-3.4H22z"/></svg></span>คู่มือ
        </summary>
        <div class="nav-body">
          <ul id="skills" class="list"></ul>
        </div>
      </details>

      <details class="nav-group" id="plugins-group" hidden>
        <summary class="nav-item" title="แผงที่ปลั๊กอินวาดไว้ให้ดู">
          <span class="nav-ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.6l1.7 4.4 4.5 1.7-4.5 1.7L12 15.8l-1.7-4.4-4.5-1.7 4.5-1.7z"/><path d="M18.6 15.9l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg></span>ปลั๊กอิน
        </summary>
        <div class="nav-body">
          <section id="plugin-panels"></section>
        </div>
      </details>
    </div>

    <!-- The two doors to the rest of the app, written out: a 15px gear in the
         header is easy to miss, and this is where people look for it. -->
    <div class="side-foot">
      <button type="button" id="side-settings" class="nav-item" title="ตั้งค่าทั้งหมด">
        <span class="nav-ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 14.5a1.7 1.7 0 0 0 .34 1.87l.06.06a2.06 2.06 0 1 1-2.91 2.91l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2.06 2.06 0 0 1-4.12 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2.06 2.06 0 1 1-2.91-2.91l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2.06 2.06 0 0 1 0-4.12h.09a1.7 1.7 0 0 0 1.56-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2.06 2.06 0 1 1 2.91-2.91l.06.06a1.7 1.7 0 0 0 1.87.34h.08a1.7 1.7 0 0 0 1.03-1.56V3a2.06 2.06 0 0 1 4.12 0v.09a1.7 1.7 0 0 0 1.03 1.56h.08a1.7 1.7 0 0 0 1.87-.34l.06-.06a2.06 2.06 0 1 1 2.91 2.91l-.06.06a1.7 1.7 0 0 0 .34 1.87v.08a1.7 1.7 0 0 0 1.56 1.03H21a2.06 2.06 0 0 1 0 4.12h-.09a1.7 1.7 0 0 0-1.51 1.18z"/></svg></span>ตั้งค่า
      </button>
      <button type="button" id="side-help" class="nav-item" title="วิธีใช้ทั้งหมด">
        <span class="nav-ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.3 9.4a2.8 2.8 0 0 1 5.5.8c0 1.8-2.8 2-2.8 3.4"/><path d="M12 17.1h.01"/></svg></span>วิธีใช้
      </button>
    </div>
  </aside>

  <section id="chat">
    <div id="meta"></div>

    <!-- The stage holds the transcript; the composer below is never covered. -->
    <div class="stage">
      <div id="log"></div>

    </div>

    <div id="pending" class="hidden">
      <div class="pending-head">
        <strong id="pending-count">0 changes</strong>
        <span id="pending-check" class="check-badge hidden"></span>
        <span class="dim">ติ๊กอย่างที่อยากเขียน</span>
        <span class="grow"></span>
        <button id="apply" class="primary">เขียนเลย</button>
        <button id="discard">ทิ้ง</button>
      </div>
      <ul id="pending-list"></ul>
    </div>

    <div id="attachments" class="hidden">
      <span class="dim">แนบ</span>
      <ul id="attachment-list"></ul>
    </div>

    <!-- The command palette: / at the start of the composer opens it, arrows
         move, Enter or Tab completes. Nothing here is hidden behind a menu. -->
    <form id="composer">
      <div class="composer-box">
        <textarea id="task" rows="2" placeholder="ถามได้เลย"></textarea>
        <div class="composer-row">
          <input type="file" id="file-picker" multiple hidden />
          <button type="button" id="attach-btn" class="round-btn" title="แนบรูป/ไฟล์/วิดีโอ">+</button>
          <button type="button" id="slash-btn" class="hint-pill" title="ดูคำสั่งทั้งหมด">/ คำสั่ง</button>
          <span class="model-chip" title="ผู้ให้บริการ — ใครตอบรันนี้ (สลับได้ที่นี่)">
            <select id="provider" title="ผู้ให้บริการ — AiPASS หรือ API อื่น"></select>
          </span>
          <span class="model-chip" title="โมเดลที่ใช้คุย">
            <select id="model" title="โมเดล"></select>
          </span>
          <span class="model-chip effort-chip" title="effort — ระดับการคิดก่อนตอบ ใช้กับโมเดลที่รองรับ">
            <select id="thinking" title="effort — ระดับการคิดก่อนตอบ">
              <option value="off">effort off</option>
              <option value="low">effort low</option>
              <option value="medium">effort medium</option>
              <option value="high">effort high</option>
              <option value="max">effort max</option>
            </select>
          </span>
          <span class="model-chip effort-chip" title="temperature — ความคิดสร้างสรรค์/การสุ่มของการตอบ (0 นิ่ง … 2 หลากหลาย); default = ค่าเริ่มต้นของโมเดล">
            <select id="temperature" title="temperature — ความคิดสร้างสรรค์/การสุ่มของการตอบ">
              <option value="default">temp default</option>
              <option value="0">temp 0</option>
              <option value="0.3">temp 0.3</option>
              <option value="0.7">temp 0.7</option>
              <option value="1">temp 1.0</option>
              <option value="1.5">temp 1.5</option>
              <option value="2">temp 2.0</option>
            </select>
          </span>
          <span class="grow"></span>
          <button type="submit" id="send" class="primary send-btn">ส่ง</button>
        </div>
      </div>
      <p class="composer-foot">
        <span class="hint" id="hint"></span>
        <span class="foot-dim">AI อาจผิดพลาดได้ ให้ลองเลี่ยงการให้ข้อมูลส่วนตัวหรือข้อมูลความลับ</span>
      </p>

      <div id="slash" class="hidden">
        <div class="slash-head">คำสั่ง <span class="dim">↑↓ เลื่อน · Enter/Tab เลือก · Esc ปิด · Shift+Tab เปลี่ยนโหมด</span></div>
        <ul id="slash-list"></ul>
      </div>
    </form>
  </section>
</main>

<div id="modal" class="hidden">
  <div class="sheet">
    <h3 id="modal-title"></h3>
    <div id="modal-body"></div>
    <div class="modal-actions" id="modal-actions"></div>
  </div>
</div>

<script type="module" src="/md.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
