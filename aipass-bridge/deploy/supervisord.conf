[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:xvfb]
command=Xvfb :99 -screen 0 1280x800x24 -ac +extension GLX +render -noreset
autorestart=true
priority=10
stdout_logfile=/var/log/xvfb.log
stderr_logfile=/var/log/xvfb_err.log

[program:fluxbox]
command=/usr/bin/fluxbox
environment=DISPLAY=":99"
autorestart=true
priority=20
stdout_logfile=/var/log/fluxbox.log
stderr_logfile=/var/log/fluxbox_err.log

[program:x11vnc]
command=/app/start-vnc.sh
environment=DISPLAY=":99"
autorestart=true
priority=30
stdout_logfile=/var/log/x11vnc.log
stderr_logfile=/var/log/x11vnc_err.log

# websockify binds 6080 inside the container; the docker-compose port mapping
# (127.0.0.1 by default) is what actually controls network exposure.
[program:novnc]
command=websockify --web /usr/share/novnc 6080 localhost:5900
autorestart=true
priority=40
stdout_logfile=/var/log/novnc.log
stderr_logfile=/var/log/novnc_err.log

[program:bridge]
command=node /app/bridge/server.mjs
directory=/app/bridge
environment=AIPASS_PORT="8787",AIPASS_HOST="0.0.0.0"
autorestart=true
priority=50
stdout_logfile=/var/log/bridge.log
stderr_logfile=/var/log/bridge_err.log

[program:browser]
command=/app/start-browser.sh
environment=DISPLAY=":99"
autorestart=true
priority=60
stdout_logfile=/var/log/browser.log
stderr_logfile=/var/log/browser_err.log
