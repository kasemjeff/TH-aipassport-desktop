<meta charset="utf-8">
<title>aipass bridge</title>
<style>
  :root {
    color-scheme: light dark;

    --bg: #f6f7f9;
    --surface: #ffffff;
    --surface-2: #f1f3f7;
    --ink: #14171f;
    --muted: #5c6472;
    --faint: #8a92a1;
    --line: #e3e6ec;
    --line-strong: #d2d7e0;

    --accent: #2f62f0;
    --accent-ink: #1e4ac7;
    --accent-soft: #e9efff;

    --ok: #17864d;
    --ok-soft: #e4f5eb;
    --warn: #a8620d;
    --warn-soft: #fdf0dd;
    --bad: #c8343a;
    --bad-soft: #fdeaea;

    --radius: 10px;
    --shadow: 0 1px 2px rgba(16, 21, 34, .06), 0 6px 16px rgba(16, 21, 34, .06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1017;
      --surface: #151a24;
      --surface-2: #1b212d;
      --ink: #e8ebf2;
      --muted: #98a1b3;
      --faint: #6a7488;
      --line: #242b38;
      --line-strong: #303849;

      --accent: #6e97ff;
      --accent-ink: #9db8ff;
      --accent-soft: #1a2540;

      --ok: #46b87c;
      --ok-soft: #14301f;
      --warn: #e0a64b;
      --warn-soft: #33260f;
      --bad: #f0666a;
      --bad-soft: #351a1c;

      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 16px rgba(0, 0, 0, .35);
    }
  }

  * { box-sizing: border-box; }

  body {
    width: 340px;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .mono {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11.5px;
  }

  /* ---------- header ---------- */
  header {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  .mark {
    width: 24px; height: 24px;
    border-radius: 7px;
    background: var(--accent);
    color: #fff;
    display: grid; place-items: center;
    font-size: 13px; font-weight: 700;
    flex: none;
  }
  .title { font-weight: 650; letter-spacing: -.01em; }
  .ver { margin-left: auto; color: var(--faint); font-size: 11px; }

  /* ---------- status hero ---------- */
  .hero {
    margin: 12px 12px 0;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  .hero-top { display: flex; align-items: center; gap: 9px; }
  .dot {
    width: 9px; height: 9px; border-radius: 50%;
    flex: none;
    position: relative;
  }
  .dot::after {
    content: ""; position: absolute; inset: -4px;
    border-radius: 50%; opacity: .22;
    background: currentColor;
  }
  .state-ok   { background: var(--ok);   color: var(--ok); }
  .state-warn { background: var(--warn); color: var(--warn); }
  .state-bad  { background: var(--bad);  color: var(--bad); }

  .state-label { font-weight: 600; letter-spacing: -.01em; }
  .pill {
    margin-left: auto;
    font-size: 10.5px; font-weight: 600;
    letter-spacing: .04em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 999px;
  }
  .pill-ok   { color: var(--ok);   background: var(--ok-soft); }
  .pill-warn { color: var(--warn); background: var(--warn-soft); }
  .pill-bad  { color: var(--bad);  background: var(--bad-soft); }

  .hint { margin-top: 7px; color: var(--muted); font-size: 12px; }
  .hint code {
    font-family: ui-monospace, Menlo, monospace;
    font-size: 11px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 4px;
  }
  .hero .act { margin-top: 10px; display: none; }
  .hero .act.show { display: block; }

  /* ---------- stats ---------- */
  .stats {
    margin: 10px 12px 0;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    overflow: hidden;
  }
  .stat { padding: 9px 10px; text-align: center; }
  .stat + .stat { border-left: 1px solid var(--line); }
  .stat .n { font-weight: 650; font-size: 15px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .stat .l { color: var(--faint); font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; margin-top: 1px; }

  /* ---------- credit meter ---------- */
  .meter {
    height: 6px;
    border-radius: 999px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    overflow: hidden;
  }
  .meter-fill {
    height: 100%;
    width: 0;
    border-radius: 999px;
    background: var(--ok);
    transition: width .3s ease;
  }
  .meter-fill.low  { background: var(--warn); }
  .meter-fill.gone { background: var(--bad); }
  .credit-row {
    display: flex; align-items: baseline; gap: 6px;
    margin-top: 6px;
    font-variant-numeric: tabular-nums;
  }
  .credit-left { font-weight: 650; font-size: 14px; letter-spacing: -.02em; }
  .credit-of { color: var(--faint); font-size: 11.5px; }
  .credit-reset { margin-left: auto; color: var(--faint); font-size: 11px; }

  /* ---------- sections ---------- */
  section { margin: 12px 12px 0; }
  .lbl {
    display: flex; align-items: center; gap: 6px;
    color: var(--faint);
    font-size: 10.5px; font-weight: 600;
    letter-spacing: .06em; text-transform: uppercase;
    margin-bottom: 5px;
  }
  .lbl .n { color: var(--faint); font-weight: 500; letter-spacing: 0; text-transform: none; }

  select, input[type="text"] {
    width: 100%;
    font: inherit;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    padding: 7px 9px;
  }
  select:focus-visible, input:focus-visible, button:focus-visible, summary:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .sub { color: var(--faint); font-size: 11px; margin-top: 5px; }

  /* ---------- buttons ---------- */
  button {
    font: inherit; font-weight: 550;
    border-radius: 8px;
    border: 1px solid var(--line-strong);
    background: var(--surface);
    color: var(--ink);
    padding: 7px 11px;
    cursor: pointer;
    transition: background .12s, border-color .12s;
  }
  button:hover { background: var(--surface-2); }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  button.primary:hover { background: var(--accent-ink); border-color: var(--accent-ink); }
  button.block { width: 100%; }
  .row { display: flex; gap: 7px; }
  .row button { flex: 1; }

  /* ---------- advanced ---------- */
  details {
    margin: 12px 12px 0;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    overflow: hidden;
  }
  summary {
    padding: 9px 12px;
    cursor: pointer;
    color: var(--muted);
    font-size: 12px;
    list-style: none;
    display: flex; align-items: center; gap: 6px;
  }
  summary::-webkit-details-marker { display: none; }
  summary::before {
    content: "›";
    display: inline-block;
    transition: transform .15s;
    color: var(--faint);
    font-size: 14px;
  }
  details[open] summary::before { transform: rotate(90deg); }
  .details-body { padding: 0 12px 12px; }

  /* ---------- footer ---------- */
  footer {
    margin: 12px 0 0;
    padding: 9px 14px 11px;
    border-top: 1px solid var(--line);
    color: var(--faint);
    font-size: 11px;
    display: flex; align-items: center; gap: 8px;
  }
  footer a { color: var(--faint); text-decoration: none; }
  footer a:hover { color: var(--accent-ink); text-decoration: underline; }
  .spacer { margin-left: auto; }

  /* ---------- toast ---------- */
  #toast {
    position: fixed;
    left: 50%; bottom: 12px;
    transform: translate(-50%, 14px);
    background: var(--ink);
    color: var(--bg);
    font-size: 11.5px; font-weight: 550;
    padding: 6px 12px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s, transform .18s;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

<header>
  <div class="mark">⇄</div>
  <div class="title">aipass bridge</div>
  <div class="ver" id="ver"></div>
</header>

<div class="hero">
  <div class="hero-top">
    <span class="dot state-bad" id="dot"></span>
    <span class="state-label" id="state">Checking…</span>
    <span class="pill pill-bad" id="pill">…</span>
  </div>
  <div class="hint" id="hint"></div>
  <div class="act" id="act">
    <button class="primary block" id="actBtn"></button>
  </div>
</div>

<div class="stats">
  <div class="stat"><div class="n" id="sJobs">–</div><div class="l">Active</div></div>
  <div class="stat"><div class="n" id="sModels">–</div><div class="l">Models</div></div>
  <div class="stat"><div class="n" id="sChat">–</div><div class="l">Chat</div></div>
</div>

<section id="creditsBox" hidden>
  <div class="lbl">Credits <span class="n" id="creditsPct"></span></div>
  <div class="meter"><div class="meter-fill" id="creditsFill"></div></div>
  <div class="credit-row">
    <span class="credit-left" id="creditsLeft">–</span>
    <span class="credit-of" id="creditsOf"></span>
    <span class="credit-reset" id="creditsReset"></span>
  </div>
</section>

<section>
  <div class="lbl">Default model <span class="n" id="count"></span></div>
  <select id="model" aria-label="Default model"></select>
  <div class="sub">Used only when a client sends no model of its own.</div>
</section>

<details id="adv">
  <summary>Advanced</summary>
  <div class="details-body">
    <div class="lbl">Bridge URL</div>
    <input type="text" id="url" spellcheck="false" autocomplete="off" placeholder="http://127.0.0.1:8787">
    <div class="row" style="margin-top:8px">
      <button id="save">Save &amp; reconnect</button>
      <button id="refresh">Refresh models</button>
    </div>
  </div>
</details>

<footer>
  <span id="foot">local only · no credentials stored</span>
  <span class="spacer"></span>
  <a href="https://github.com/niawjunior/aipass-bridge" target="_blank" rel="noreferrer">Docs</a>
</footer>

<div id="toast" role="status" aria-live="polite"></div>

<script src="popup.js"></script>
